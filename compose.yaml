# VELLUR AI CORE — control-plane stack on the VPS (/opt/vellur-ai-core). Inference runs elsewhere (GPU).
#
#   gateway     LiteLLM      → 127.0.0.1:${GATEWAY_PORT}  always on   (public: https://ai.vellurdigital.com/v1 via Caddy)
#   gpu-tunnel  SSH forward  → no port; only gateway sees it       profile "gpu" (sudo vac gpu up|down)
#   webui       Open WebUI   → 127.0.0.1:${WEBUI_PORT}     optional    profile "ui"  (sudo vac ui enable) — ~1 GB RAM
#   autopilot   GPU Autopilot → 127.0.0.1:${AUTOPILOT_PORT} (dashboard/API, behind Caddy basic auth)  profile "autopilot"
#               + internal model router "gpu-backend:8000" (model APIs or GPU) that LiteLLM calls
#   agent       isolated OpenCode workspace, no port, own network           profile "agent" (sudo vac agent enable)
#
# Nothing listens on a public interface: Caddy (already on the server) is the only way in.
# Secrets come from .env (mode 600, generated by install.sh, never committed).
# Use the helper instead of raw docker commands:  sudo vac status | logs | restart | update | backup

name: vellur-ai-core

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  networks: [core]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  gateway:
    <<: *hardening
    image: ${LITELLM_IMAGE:?set in .env}
    container_name: vellur-ai-gateway
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"   # do not download the price list from GitHub at start
      DISABLE_ADMIN_UI: "True"
      LITELLM_LOG: "WARNING"
      # Future inference backends (empty until a GPU server exists; see litellm/models.example.yaml)
      VELLUR_GPU_API_BASE: ${VELLUR_GPU_API_BASE:-http://gpu-tunnel:8000/v1}   # default: the SSH tunnel
      VELLUR_GPU_API_KEY: ${VELLUR_GPU_API_KEY:-}
      VELLUR_EMBED_API_BASE: ${VELLUR_EMBED_API_BASE:-}
    volumes:
      - ./litellm:/etc/litellm:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3311}:4000"
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  gpu-tunnel:
    <<: *hardening
    profiles: ["gpu"]
    build: ./tunnel
    image: vellur-ai-core/gpu-tunnel:local
    container_name: vellur-ai-gpu-tunnel
    environment:
      GPU_SSH_HOST: ${GPU_SSH_HOST:-}
      GPU_SSH_PORT: ${GPU_SSH_PORT:-}
      GPU_SSH_USER: ${GPU_SSH_USER:-root}
      GPU_REMOTE_PORT: ${GPU_REMOTE_PORT:-8000}
    volumes:
      - ./secrets/gpu_ed25519:/run/vellur/gpu_ed25519:ro
      - ./secrets/gpu_known_hosts:/run/vellur/gpu_known_hosts:ro
    read_only: true
    tmpfs: ["/tmp:size=1m"]
    cap_drop: [ALL]
    mem_limit: 48m
    cpus: 0.25
    pids_limit: 16
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 30s

  autopilot:
    <<: *hardening
    profiles: ["autopilot"]
    build: ./autopilot
    image: vellur-ai-core/autopilot:local
    container_name: vellur-ai-autopilot
    networks:
      core:
        aliases: [gpu-backend]
      agents:
        aliases: [autopilot]
    environment:
      AUTOPILOT_LIVE: ${AUTOPILOT_LIVE:-0}
      AUTOPILOT_HARD_MAX_MONTHLY_USD: ${AUTOPILOT_HARD_MAX_MONTHLY_USD:-50}
      AUTOPILOT_HARD_MAX_HOURLY_USD: ${AUTOPILOT_HARD_MAX_HOURLY_USD:-0.50}
      AUTOPILOT_ADMIN_SECRET: ${AUTOPILOT_ADMIN_SECRET:-}
      AUTOPILOT_PUBLIC_ORIGIN: "https://${AI_DOMAIN}"
      AUTOPILOT_NOTIFY_URL: ${AUTOPILOT_NOTIFY_URL:-}
      AUTOPILOT_REQUEST_HOLD_SECONDS: ${AUTOPILOT_REQUEST_HOLD_SECONDS:-840}
      AUTOPILOT_GATEWAY_URL: "http://gateway:4000"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      VELLUR_GPU_API_KEY: ${VELLUR_GPU_API_KEY:-}
      VAST_API_KEY: ${VAST_API_KEY:-}
      AGENT_RUNNER_URL: ${AGENT_RUNNER_URL:-}
      AGENT_RUNNER_SECRET: ${AGENT_RUNNER_SECRET:-}
    volumes:
      - autopilot-data:/data
      - ./secrets/gpu_ed25519:/run/vellur/gpu_ed25519:ro
      - ./secrets/gpu_ed25519.pub:/run/vellur/gpu_ed25519.pub:ro
      - ./secrets/gpu_known_hosts:/run/vellur/gpu_known_hosts:ro
    ports:
      - "127.0.0.1:${AUTOPILOT_PORT:-3312}:8080"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 20s

  # Isolated coding-agent workspace: no secrets, no Docker socket, its own network (it can reach only the
  # Autopilot model router and the internet). Tasks get a short-lived inference token.
  agent:
    <<: *hardening
    profiles: ["agent"]
    build: ./agent
    image: vellur-ai-core/agent:local
    container_name: vellur-ai-agent
    networks: [agents]
    environment:
      AGENT_RUNNER_SECRET: ${AGENT_RUNNER_SECRET:-}
    volumes:
      - agent-work:/work
    tmpfs: ["/tmp:size=512m,exec"]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 1024
    stop_grace_period: 10s

  webui:
    <<: *hardening
    profiles: ["ui"]
    image: ${WEBUI_IMAGE:?set in .env}
    container_name: vellur-ai-webui
    environment:
      WEBUI_NAME: "VELLUR AI"
      WEBUI_URL: "https://${AI_DOMAIN:?set in .env}"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set in .env}
      CORS_ALLOW_ORIGIN: "https://${AI_DOMAIN}"
      WEBUI_SESSION_COOKIE_SECURE: "True"
      WEBUI_AUTH_COOKIE_SECURE: "True"
      # Accounts: login required, nobody can register. The first (and only) admin is
      # created by install.sh on 127.0.0.1 before the site is made public.
      WEBUI_AUTH: "True"
      ENABLE_SIGNUP: "False"
      DEFAULT_USER_ROLE: "pending"
      # Models: only through the VELLUR gateway; no Ollama, no direct providers.
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: "http://gateway:4000/v1"
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      # No local AI on this VPS: embeddings and speech go to the gateway too (they work once a
      # backend is connected); nothing is downloaded from Hugging Face at start.
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_OPENAI_API_BASE_URL: "http://gateway:4000/v1"
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      RAG_EMBEDDING_MODEL: "vellur-embed"
      AUDIO_STT_ENGINE: "openai"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://gateway:4000/v1"
      AUDIO_STT_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      HF_HUB_OFFLINE: "1"
      OFFLINE_MODE: "True"
      # Quiet and private.
      ENABLE_WEB_SEARCH: "False"
      ENABLE_COMMUNITY_SHARING: "False"
      ENABLE_CODE_INTERPRETER: "False"
      ENABLE_EVALUATION_ARENA_MODELS: "False"
      ENABLE_VERSION_UPDATE_CHECK: "False"
      ANONYMIZED_TELEMETRY: "False"
      SCARF_NO_ANALYTICS: "True"
      DO_NOT_TRACK: "True"
      UVICORN_WORKERS: "1"
    volumes:
      - webui-data:/app/backend/data
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3310}:8080"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # the image's start script needs these
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

networks:
  core:
    name: vellur-ai-core
    driver: bridge
  agents:
    name: vellur-ai-agents
    driver: bridge

volumes:
  webui-data:
    name: vellur-ai-core-webui-data
  autopilot-data:
    name: vellur-ai-core-autopilot-data
  agent-work:
    name: vellur-ai-core-agent-work
