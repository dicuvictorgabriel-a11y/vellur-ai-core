# VELLUR AI CORE — public model names. LiteLLM hands every request to the VELLUR model router
# (Autopilot, http://gpu-backend:8000/v1), which picks a model API or the GPU backend according to the routes set in
# the workspace (Models tab) and records usage and cost. Clients only ever see these names.
model_list:
  - model_name: vellur-coder
    litellm_params: &router
      model: hosted_vllm/vellur-coder
      api_base: os.environ/VELLUR_GPU_API_BASE
      api_key: os.environ/VELLUR_GPU_API_KEY
      timeout: 1800          # a GPU cold start may hold a request up to ~14 min
      stream_timeout: 960
    model_info: &info
      mode: chat
      supports_function_calling: true
  - model_name: vellur-chat
    litellm_params:
      <<: *router
      model: hosted_vllm/vellur-chat
    model_info: *info
  - model_name: vellur-max
    litellm_params:
      <<: *router
      model: hosted_vllm/vellur-max
    model_info: *info
